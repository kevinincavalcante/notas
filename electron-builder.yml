appId: app.notas.desktop
# Knotas: nome EXIBIDO (busca do GNOME/Zorin, atalho no menu). O nome interno
# continua "notas" (package.json) — é ele que define userData (~/.config/notas),
# então a réplica local, sessão e config do .deb NÃO migram de pasta.
productName: Knotas

# v1: sem asar — menos surfada com .next e módulos nativos (libsql, sharp)
asar: false

files:
  - dist-electron/**/*
  - .next/**/*
  - public/**/*
  - package.json

linux:
  target: deb
  category: Office
