plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.kevinincavalcante.notas.sharereceiver'
version = '1.0.0'

android {
  namespace "com.kevinincavalcante.notas.sharereceiver"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }

  lintOptions {
    abortOnError false
  }
}

repositories {
  mavenCentral()
}

dependencies {
  implementation "com.facebook.react:react-android"
}
