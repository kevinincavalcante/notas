name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/android.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Instalar dependências
        run: npm ci
        working-directory: mobile

      # versionCode cresce a cada run (senão o celular recusa upgrade do APK)
      - name: Bump versionCode
        run: node -e "const fs=require('fs');const f='app.json';const j=JSON.parse(fs.readFileSync(f,'utf8'));j.expo.android.versionCode=process.env.RUN;fs.writeFileSync(f,JSON.stringify(j,null,2))"
        env:
          RUN: ${{ github.run_number }}
        working-directory: mobile

      - name: Gerar projeto Android (expo prebuild)
        run: npx expo prebuild -p android --no-install
        working-directory: mobile

      # Só o ABI do celular do dono: compila 4x menos C++ e APK ~2x menor.
      # sed (e não echo >>): anexar sem quebra de linha corrompia a última
      # propriedade do arquivo e quebrava o JSON.parse do autolinking.
      - name: Focar build em arm64-v8a
        run: sed -i 's/^reactNativeArchitectures=.*/reactNativeArchitectures=arm64-v8a/' android/gradle.properties
        working-directory: mobile

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('mobile/android/**/build.gradle*', 'mobile/android/gradle.properties') }}
          restore-keys: gradle-

      - name: Compilar APK (release, assinado com debug keystore)
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
        working-directory: mobile/android

      - name: Publicar no GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.run_number }}
        run: |
          VER=$(node -p "require('./app.json').expo.version")
          cp android/app/build/outputs/apk/release/app-release.apk "/tmp/notas-${VER}-v${VERSION}.apk"
          gh release create "apk-v${VERSION}" \
            --title "Notas ${VER} (APK v${VERSION})" \
            --notes "APK do app mobile. Instala por cima da versão anterior (versionCode ${VERSION})." \
            "/tmp/notas-${VER}-v${VERSION}.apk"
        working-directory: mobile
